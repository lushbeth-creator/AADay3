<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Propelr: Today's Flight Plan</title><style>
*{box-sizing:border-box}body{margin:0;padding:.15rem .5rem .5rem;background:transparent;color:#1a1a2e;font-family:Inter,Aptos,"Segoe UI",Arial,sans-serif;line-height:1.52}.wrap{max-width:100%;margin:0}.lead{margin:0 0 16px;color:#000;font-size:16px}.window{border:1px solid #A6B3D5;border-radius:16px;background:linear-gradient(135deg,#E4E9F7,#DAF3EF);padding:22px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stop{border:1px solid #D7DDEC;border-radius:12px;background:#fff;padding:16px;text-align:left;font:inherit;color:#1a1a2e;cursor:pointer}.stop:hover{border-color:#59A398;box-shadow:0 4px 12px rgba(51,66,112,.08)}.stop.active{border-color:#59A398;background:#59A398}.icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#E4E9F7,#DAF3EF);color:#1B2F5B;display:grid;place-items:center;margin-bottom:10px}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.stop b{display:block;font-size:18px;font-weight:700;color:#1B2F5B;margin-bottom:4px}.stop small{display:block;font-size:16px;color:#000}.stop.active .icon{background:#fff;color:#1B2F5B}.stop.active b,.stop.active small{color:#fff}.detail{margin-top:12px;border:1px solid #D7DDEC;background:#F3F6FF;border-radius:10px;padding:14px;min-height:78px;font-size:16px;color:#000}.detail b{color:#1B2F5B;font-size:18px}.detail p{margin:8px 0 0}
@media(max-width:700px){.grid3{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><p class="lead">Follow the merchant journey from the first conversation through the decision, launch and long-term relationship.</p>
<section class="window"><div class="grid3">
<button class="stop active" data-stop="connect"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span><b>Earn the Conversation</b><small>Prospect with purpose, deliver a relevant pitch and secure dedicated time.</small></button>
<button class="stop" data-stop="solve"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4M8 11h6M11 8v6"/></svg></span><b>Discover and Recommend</b><small>Uncover the business need, read the evidence and connect it to the right solution.</small></button>
<button class="stop" data-stop="retain"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 8c0 6-8 11-8 11S4 14 4 8a4 4 0 0 1 7-3 4 4 0 0 1 7 0 4 4 0 0 1 2 3Z"/></svg></span><b>Protect the Relationship</b><small>Set honest expectations, make a clean handoff and remain useful after launch.</small></button>
</div>
<div class="detail" id="detail"><b>Start with relevance</b><p>The goal is not to explain everything at the door. Earn enough trust and curiosity to continue the conversation.</p></div>
</section></main>
<script>
const details={
 connect:['Start with relevance','The goal is not to explain everything at the door. Earn enough trust and curiosity to continue the conversation.'],
 solve:['Let discovery lead','Ask, listen and use the merchant\u2019s facts to build a recommendation that solves a meaningful business problem.'],
 retain:['Stay connected after the yes','The Aviator protects trust through accurate expectations, a strong handoff and thoughtful follow-up while Partner Development guides Stratus and onboarding.']
};
document.querySelectorAll('.stop').forEach(button=>button.addEventListener('click',()=>{
 document.querySelectorAll('.stop').forEach(item=>item.classList.remove('active'));
 button.classList.add('active');
 const content=details[button.dataset.stop];
 detail.innerHTML='<b>'+content[0]+'</b><p>'+content[1]+'</p>';
}));
</script>
</body></html>
