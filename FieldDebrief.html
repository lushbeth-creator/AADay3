<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 3 | 60-Second Field Debrief</title>
<style>
:root{--blue:#5D70AE;--pale:#F3F6FF;--light:#DAF3EF;--ink:#26324b;--muted:#647087}
*{box-sizing:border-box}
button{font:inherit}
body{margin:0;color:var(--ink);font-family:Inter,Aptos,"Segoe UI",Arial,sans-serif;background:#fbfcff;line-height:1.55}
.shell{max-width:1180px;margin:auto;padding:0 28px}
h2{font-family:Inter,Aptos,"Segoe UI",sans-serif;line-height:1.08;margin:0;font-size:clamp(2rem,4vw,3.3rem);letter-spacing:-.035em}
section{padding-top:0;padding-bottom:56px}
.debrief{background:linear-gradient(135deg,#ffffff 0%,#E4E9F7 100%);border-radius:30px;padding:32px}
.debrief-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:28px;align-items:start}
.debrief-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.debrief-buttons button{border:1px solid #dce3ed;background:white;border-radius:99px;padding:9px 13px;cursor:pointer;font-weight:750;color:var(--ink)}
.debrief-buttons button.active{background:var(--blue);border-color:var(--blue);color:white}
.debrief-question{background:linear-gradient(135deg,#ffffff 0%,#E4E9F7 100%);border-radius:22px;padding:26px;min-height:164px;font-size:1.3rem;font-weight:750}
.debrief-question small{display:block;font-size:1rem;font-weight:500;color:var(--muted);margin-top:12px}
@media(max-width:850px){.debrief-grid{grid-template-columns:1fr}}
.reveal{opacity:0;transform:translateY(14px);transition:.55s}
.reveal.show{opacity:1;transform:none}
</style>
</head>
<body>
<section><div class="shell"><div class="debrief reveal"><div class="debrief-grid">
  <div><h2 style="font-size:2rem">One question can unlock the next move.</h2><div class="debrief-buttons"><button class="active" data-debrief="win">Reinforce a win</button><button data-debrief="stuck">When stuck</button><button data-debrief="commit">Build commitment</button><button data-debrief="support">Offer support</button></div></div>
  <div><div class="debrief-question" id="debriefQuestion">"What did you do that created the best response from the merchant?"<small>Help the agent identify a repeatable behavior, not simply celebrate the result.</small></div></div>
</div></div></div></section>
<script>
const debriefs={win:['\u201cWhat did you do that created the best response from the merchant?\u201d','Help the agent identify a repeatable behavior, not simply celebrate the result.'],stuck:['\u201cWhat question, if answered, would help you see the next move?\u201d','Keep ownership with the agent. Expand their options before offering advice.'],commit:['\u201cWhat will you do next, and by when?\u201d','Turn intention into observable activity with an owner and deadline.'],support:['\u201cHow can I best support you without taking over?\u201d','Agree on the right level of coaching, resources and accountability.']};
document.querySelectorAll('[data-debrief]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-debrief]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const d=debriefs[b.dataset.debrief];document.getElementById('debriefQuestion').innerHTML=d[0]+'<small>'+d[1]+'</small>'}));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});
document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
</script>
</body>
</html>
